[pytest]
testpaths = tests_phase3 tests_lab tests_assistant tests_integrity ../validation/phase4/tests
pythonpath = . ..
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
