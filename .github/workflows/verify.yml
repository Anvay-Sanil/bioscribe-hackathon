name: Verify supported BioScribe workflow
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: npm
          cache-dependency-path: bioscribe-ai/package-lock.json
      - name: Verify source, install hashes, test, replay and build
        run: python -B scripts/verify.py --install
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results
          path: verification-output/
